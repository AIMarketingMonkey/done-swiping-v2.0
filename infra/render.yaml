# Render Blueprint — Done Swiping
# Docs: https://render.com/docs/blueprint-spec
#
# This declares only the env vars NEEDED FOR THE FIRST DEPLOY. Optional features
# (real age vendor, Stripe payments, Sentry, embeddings/matching, ElevenLabs)
# are added later in the Render dashboard — they're not listed here so the
# Blueprint doesn't prompt you for keys you don't have yet. The code runs fine
# without them (dev-mock age gate, payments return 501, etc.).
#
# Docker web/worker run in Frankfurt (EU). Static sites are global (no region).
# Vars marked sync:false are entered in the dashboard; you already have most.

services:
  # ---------------------------------------------------------------------------
  # API — Hono (TypeScript) web service. Build context = repo root (pnpm workspace).
  # ---------------------------------------------------------------------------
  - type: web
    name: done-swiping-api
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_REGION
        value: uk
      - key: IDV_DEV_MODE # dev-mock age gate — no IDV vendor needed yet
        value: 'true'
      - key: APP_DEEP_LINK
        value: doneswiping://
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # Set to this service's own https URL AFTER the first deploy
      # (e.g. https://done-swiping-api.onrender.com). Leave blank for now.
      - key: API_PUBLIC_URL
        sync: false
      # --- Add later in the dashboard when you enable each feature ---
      #   EMBEDDINGS_API_KEY                          (memory matching)
      #   STRIPE_SECRET_KEY / STRIPE_PUBLISHABLE_KEY /
      #   STRIPE_WEBHOOK_SECRET / STRIPE_PRICE_PREMIUM (payments)
      #   IDV_PROVIDER / IDV_API_KEY / IDV_WEBHOOK_SECRET (real age vendor; then set IDV_DEV_MODE=false)
      #   SENTRY_DSN                                  (error tracking)

  # ---------------------------------------------------------------------------
  # Voice agent — Python / LiveKit Agents worker (connects out to LiveKit).
  # ---------------------------------------------------------------------------
  - type: worker
    name: done-swiping-voice-agent
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: services/voice-agent/Dockerfile
    dockerContext: services/voice-agent
    envVars:
      - key: APP_REGION
        value: uk
      - key: TTS_PROVIDER # cartesia | elevenlabs | ab
        value: cartesia
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: CARTESIA_VOICE_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # --- Add later in the dashboard ---
      #   ELEVENLABS_API_KEY (+ set TTS_PROVIDER=elevenlabs|ab)
      #   CARTESIA_MODEL_ID  (defaults to sonic-3)
      #   EMBEDDINGS_API_KEY (extraction → matching)
      #   SENTRY_DSN

  # ---------------------------------------------------------------------------
  # Web (Expo web export) — global static site. You already have these values
  # (Supabase URL + anon key); set the API URL after the API's first deploy.
  # ---------------------------------------------------------------------------
  - type: web
    name: done-swiping-web
    runtime: static
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @done-swiping/mobile build
    staticPublishPath: apps/mobile/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: EXPO_PUBLIC_API_URL # https://done-swiping-api.onrender.com (after API deploys)
        sync: false

  # ---------------------------------------------------------------------------
  # Admin — Vite SPA, global static site.
  # ---------------------------------------------------------------------------
  - type: web
    name: done-swiping-admin
    runtime: static
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @done-swiping/admin build
    staticPublishPath: apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL # https://done-swiping-api.onrender.com (after API deploys)
        sync: false
