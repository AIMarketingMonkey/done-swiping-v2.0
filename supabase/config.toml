# Supabase local development config.
# Note: region (London/Frankfurt) is configured on the HOSTED project, not here.
# Local dev runs in Docker. Run `supabase init` to regenerate if your CLI
# version expects a different shape.

project_id = "done-swiping"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000", "doneswiping://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# OAuth providers (Apple, Google) are configured in M1. Secrets come from env.
# [auth.external.apple]
# enabled = true
# [auth.external.google]
# enabled = true

[analytics]
enabled = false
