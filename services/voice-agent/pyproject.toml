[project]
name = "done-swiping-voice-agent"
version = "0.1.0"
description = "Done Swiping voice agent — LiveKit Agents service (Deepgram Flux STT → Claude brain → Cartesia/ElevenLabs TTS)"
requires-python = ">=3.11"
dependencies = [
    # Pinned to major 1.x — the 0.x → 1.x API break was significant (VoiceAssistant → Agent/AgentSession).
    # Bump only after reviewing the changelog.
    "livekit-agents>=1.6.1,<2",
    "livekit-plugins-deepgram>=1.6.1,<2",
    "livekit-plugins-anthropic>=1.6.1,<2",
    "livekit-plugins-cartesia>=1.6.1,<2",
    "livekit-plugins-elevenlabs>=1.6.1,<2",
    # livekit-plugins-silero is deprecated in 1.x; AgentSession now bundles Silero VAD.
    # Kept here only for reference; not imported in agent.py.
    # "livekit-plugins-silero>=1.6.1,<2",
    "anthropic>=0.40",
    "supabase>=2.9",
    "python-dotenv>=1.0",
    "openai>=1.0",  # embeddings (default provider); swap/remove if using Voyage/Gemini
    "sentry-sdk>=2.0",  # error reporting — initialised only when SENTRY_DSN is set
]

[project.scripts]
voice-agent = "agent:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function calls in default arguments
]

[tool.ruff.lint.isort]
known-first-party = ["lib", "extraction"]

[tool.uv]
# Dev command: uv run python agent.py dev
# Sync deps:   uv sync
